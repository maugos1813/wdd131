<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css" />
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <main>
    <h1>Product Review</h1>
    <form action="review.html" method="get">
      <label for="productName">Product Name</label>
      <select id="productName" name="productName" required>
        <option disabled selected value="">Select a Product ...</option>
      </select>
      <fieldset>
        <legend>Overall Rating</legend>
        <label><input type="radio" name="rating" value="1" required /> 1 ★</label>
        <label><input type="radio" name="rating" value="2" /> 2 ★</label>
        <label><input type="radio" name="rating" value="3" /> 3 ★</label>
        <label><input type="radio" name="rating" value="4" /> 4 ★</label>
        <label><input type="radio" name="rating" value="5" /> 5 ★</label>
      </fieldset>

      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required />

      <fieldset>
        <legend>Useful Features (check all that apply)</legend>
        <label><input type="checkbox" id="feature1" name="features" value="Easy Setup" /> Easy Setup</label>
        <label><input type="checkbox" id="feature2" name="features" value="Durability" /> Durability</label>
        <label><input type="checkbox" id="feature3" name="features" value="Design" /> Design</label>
        <label><input type="checkbox" id="feature4" name="features" value="Battery Life" /> Battery Life</label>
      </fieldset>

      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="4" placeholder="Share your experience..."></textarea>

      <label for="username">Your Name (Optional)</label>
      <input type="text" id="username" name="username" />

      <input type="submit" value="Submit Review" />
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Your Name | WDD 131</p>
  </footer>

  <script src="js/form.js"></script>
</body>
</html>
