<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Confirmation page for submitted product reviews with review counter." />
  <meta name="author" content="mauro Agostinelli" />
  <title>Review Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css" />
</head>
<body>
  <main>
    <h1>Thank You for Your Review!</h1>
    <p>Your review has been submitted.</p>
    <p>Total reviews submitted on this device: <span id="counter">0</span></p>
    <a href="form.html">Submit another review</a>
  </main>

  <footer>
    <p>&copy; 2025 Your Name | WDD 131</p>
  </footer>

  <script>
    const counter = localStorage.getItem("reviewCount") || 0;
    const newCount = parseInt(counter) + 1;
    localStorage.setItem("reviewCount", newCount);
    document.getElementById("counter").textContent = newCount;
  </script>
</body>
</html>
