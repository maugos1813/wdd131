<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Boost your online presence with Web Elevate. Explore our web design levels and contact us today.">
  <title>Web Elevate - Contact</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="images/maudevtechicon.png" alt="Logo" class="logo-img" loading="lazy" />
                Web Elevate
              </div>
            <button class="hamburger" id="hamburger">&#9776;</button>
            <ul class="nav-links" id="nav-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="levels.html">Levels</a></li>
              <li><a href="references.html">References</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </nav>
      </header>

      <main>
        <div class="container">
          <h1>Contact Us</h1>
          <form id="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
      
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
      
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>
      
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
      
            <button type="submit">Send Message</button>
          </form>
        </div>
      </main>

  <footer>
    <p>&copy; 2025 Web Elevate | <a href="references.html">References</a></p>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
